name: Weekly Hotspot Analysis

"on":
  schedule:
    - cron: "37 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra llm

      - name: Checkout Blog-mizuki
        uses: actions/checkout@v4
        with:
          repository: dreamnight16/Blog-mizuki
          path: blog
          token: ${{ secrets.BLOG_PAT }}

      - name: Run weekly analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BLOG_CONTENT_DIR: ${{ github.workspace }}/blog/src/content/weekly
          WEB_DATA_DIR: ${{ github.workspace }}/web/src/data/weekly
        run: uv run python weekly-cli/main.py

      - name: Commit web data (格物独立站)
        run: |
          git config user.name "weekly-bot"
          git config user.email "bot@dreamnight.net.cn"
          git add web/src/data/weekly/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(date +%Y-W%V)
            git commit -m "chore: update weekly data for web $WEEK"
            git push
          fi

      - name: Push to Blog-mizuki
        working-directory: blog
        run: |
          git config user.name "weekly-bot"
          git config user.email "bot@dreamnight.net.cn"
          git add src/content/posts/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(date +%Y-W%V)
            git commit -m "chore: update weekly hotspot $WEEK"
            git -c http.extraheader= push https://x-access-token:${{ secrets.BLOG_PAT }}@github.com/dreamnight16/Blog-mizuki.git
          fi
