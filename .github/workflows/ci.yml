name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Security scan
        run: uv run --with bandit bandit -r weekly-cli/ -ll
      - name: Run tests
        run: uv run pytest weekly-cli/ -v --cov=weekly-cli --cov-report=term-missing --cov-fail-under=80 -m "not integration"
      # Unit coverage says the code does what it was written to do. This says
      # the *output* is still grounded: no unfounded motive attribution, no
      # assertion published without evidence, no good analysis lost to the gate.
      - name: Content regression evaluation
        run: uv run python weekly-cli/evaluation/runner.py
