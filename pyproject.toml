# NOTE: Pin critical deps to exact versions with hashes for production.
#   pip hash chinese_scraper_utils-0.2.6-py3-none-any.whl
[project]
name = "weekly-hotspot"
version = "0.3.1"
description = "格物 (Dianalyze) — 以唯物辩证法为核心的 AI 热点深度分析 · 五阶段辩证认识运动"
readme = "README.md"
license = "MIT"
authors = [
    { name = "DreamNight", email = "support@dreamnight.net.cn" }
]
keywords = ["hotspot", "news", "analysis", "deepseek", "llm", "weekly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
# Pinned to exact versions for reproducible installs. Generate a lockfile after
# any change (e.g. `pip-compile` or `uv lock`). The git dep is pinned to the
# exact commit SHA of chinese-scraper-utils master to avoid a mutable ref.
dependencies = [
    "chinese-scraper-utils @ git+https://github.com/dreamnight16/chinese-scraper-utils.git@4fff8609682522cf671ee1996b85c928e9477a23",
    "openai==1.109.1",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "ddgs==9.14.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["weekly-cli"]
markers = [
    "unit: Unit tests that run without network/API calls",
    "integration: Integration tests that require DEEPSEEK_API_KEY",
]

[project.urls]
Homepage = "https://github.com/dreamnight16/weekly-hotspot"
Repository = "https://github.com/dreamnight16/weekly-hotspot.git"
Issues = "https://github.com/dreamnight16/weekly-hotspot/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
